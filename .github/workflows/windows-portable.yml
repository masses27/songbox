name: windows-portable

# 本机编不了 Windows：flutter build windows 要求能建符号链接，而这台机的账号没有
# SeCreateSymbolicLinkPrivilege、开发者模式也没开（开它要写 HKLM）。runner 上这两条都
# 现成，所以 Windows 产物一律在这里编，Android 那条 build.sh 完全不受影响。
#
# 仓库里不提交 windows/ 那套 C++ 壳子，构建时在临时 workspace 里现造一份，
# 免得日后 flutter upgrade 改壳子文件时来来回回产生噪声 diff。
on:
  workflow_dispatch:
    inputs:
      only_dir:
        description: '留空即正常构建；填 skip 用于验证 workflow 本身'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-portable
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 和装机那台对齐；本机 flutter doctor 也是这个版本。
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: 造出 windows/ 壳子
        shell: pwsh
        run: flutter create --platforms=windows --project-name lyric_music .

      - name: 生成中文标题和自适应窗口配置
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dart tool/patch_windows.dart
          if ($LASTEXITCODE -ne 0) { throw 'Windows runner patch failed' }

      - name: 换成我们自己的图标
        shell: powershell
        # 任务栏那颗图标不是「外面配的」，是从 lyric_music.exe 自己的资源里读的：runner 的
        # 窗口类拿 IDI_APP_ICON（windows/runner/win32_window.cpp），而 IDI_APP_ICON 就是
        # Runner.rc 里那句 `ICON "resources\app_icon.ico"`。flutter create 往那个位置放的是
        # Flutter 自己的 logo，所以以前只有启动器带我们的标、窗口一开起来任务栏就换成了
        # Flutter 那颗。构建前把它覆盖掉，zip 和单文件两条路一起好。
        #
        # 走 5.1、正文纯 ASCII 那两条理由写在下面「单文件版」那条注释里；图标逻辑本体都在
        # tool/windows/make_icon.ps1，这里只是把它装进壳子。
        run: |
          $ErrorActionPreference = 'Stop'
          $mk = Join-Path $env:GITHUB_WORKSPACE 'tool/windows/make_icon.ps1'
          if (-not (Test-Path $mk)) { throw "icon script missing: $mk" }
          & $mk -RunnerResourceDir 'windows/runner/resources'

      - name: pub get
        shell: pwsh
        run: flutter pub get

      - name: 版本号对齐
        shell: pwsh
        # 「关于」和日志里那句版本号读的是 lib/settings/app_settings.dart 里的常量，
        # 不是 pubspec。安卓那条 build.sh 会在打包前把这一行按 pubspec 改写，这里没有
        # 等价步骤，所以 v0.8.43 那次 Actions 编的是常量还写着 0.8.42 的提交——发出去
        # 的两份桌面产物自报 v0.8.42，跟 Release 标题和 APK 对不上。宁可构建失败，也不
        # 让产物带着错版本出门。
        run: |
          $ErrorActionPreference = 'Stop'
          $pub = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value.Split('+')[0]
          $const = (Select-String -Path lib/settings/app_settings.dart -Pattern "static const appVersion = '([^']+)'" | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($const -ne $pub) { throw "appVersion=$const != pubspec=$pub; fix lib/settings/app_settings.dart before shipping" }
          Write-Host "appVersion = $const"

      - name: 构建 release
        shell: pwsh
        run: flutter build windows --release

      - name: 组装免安装包
        shell: pwsh
        env:
          ONLY_DIR: ${{ inputs.only_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hit = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $ver = $hit.Matches[0].Groups[1].Value.Split('+')[0]
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/version.txt -Value $ver -Encoding ascii -NoNewline
          $stage = "dist/songbox-$ver-windows-x64"
          $src = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $src)) { $src = 'build/windows/x64/Release' }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "$src/*" -Destination $stage -Recurse -Force

          # 这一版要验的不是「exe 能不能起」而是「能不能出声」：声音全靠 libmpv 那颗
          # DLL，media_kit_libs_windows_audio 会在 cmake 阶段把它拉下来拷到 exe 旁边。
          # 少了它 exe 照样跑得起来、照样放不出歌，所以在这儿当失败拦掉，别让她试。
          $mpv = Get-ChildItem -Path $stage -Filter 'libmpv-2.dll' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $mpv) { throw 'libmpv-2.dll 没进包：media_kit 那条音频后端起不来' }
          "libmpv: $([math]::Round($mpv.Length/1MB,1))MB"

          # 图标要验的是「她双击的那颗 exe 里有没有」，不是「我们生成过一张 ico」。上面那步
          # 万一没盖对位置（模板换了目录、rc 不认这张 ico），构建照样成功、任务栏照样是
          # Flutter 那颗。编源文件时每一帧 ICO 会原样落成一条 RT_ICON（本机拿 csc -win32icon
          # 编过一颗试验 exe 核对：最大那帧的字节在文件里找得到，notepad 里找不到），所以拿
          # 最大那帧的字节在产物 exe 里搜。脚本本体只跑 5.1（System.Drawing），这里显式起一颗。
          $exe = Join-Path $stage 'lyric_music.exe'
          if (-not (Test-Path $exe)) { throw "runner exe missing: $exe" }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tool/windows/make_icon.ps1 -VerifyExe $exe
          if ($LASTEXITCODE -ne 0) { throw "exe 里没找到我们的图标帧（powershell 退出码 $LASTEXITCODE）" }

          # 干净机器不一定装了 VC++ 运行库；runner 上的 VS 带着可再发行版本，抄三个
          # DLL 进去就是「拷走双击能跑」。找不到就跳过，不让整个构建失败。
          $crt = Get-ChildItem -Path 'C:\Program Files*\Microsoft Visual Studio' -Recurse -Filter 'vcruntime140.dll' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if ($crt) {
            $crtDir = $crt.DirectoryName
            foreach ($d in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
              $p = Join-Path $crtDir $d
              if (Test-Path $p) { Copy-Item $p $stage -Force }
            }
            "bundled CRT from $crtDir"
          } else {
            'VC++ runtime DLLs not located on runner; skipped'
          }

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/songbox-$ver-windows-x64-portable.zip" -Force
          Get-ChildItem dist | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1MB,1))MB" }

      - name: 单文件版
        shell: powershell
        # 这一整步走 Windows PowerShell 5.1 而不是默认那层 pwsh 7：System.Drawing 和
        # csc.exe 都是 .NET Framework 上的东西，5.1 在 runner 上必定有，本机我也是用
        # 5.1 验的，两边同一条路；pwsh 7 里的 System.Drawing 是另一套（Drawing.Common），
        # 我不想为一颗图标赌它。
        #
        # 注意下面那段脚本里一个字汉字都没有：Actions 把 run 写成临时 .ps1 是不带 BOM 的
        # UTF-8，5.1 读不带 BOM 的文件按机器 ANSI 代码页解——上一版桌面脚本就是这么把文件夹
        # 名解成「--windows-x64」的。理由全写在这条注释里（YAML 自己按 UTF-8 解析，不经
        # PowerShell 的手），脚本正文只留 ASCII。
        #
        # Icon: tool/windows/make_icon.ps1 builds it from the Android master PNG instead
        # of committing an .ico. The logo changed three times around 0.8.32-0.8.34, and a
        # committed binary is exactly what the next logo change forgets to regenerate.
        # The same script, run before the build, drops that identical .ico into
        # windows/runner/resources/app_icon.ico -- which is where the taskbar icon comes
        # from -- so launcher and app window can no longer disagree.
        # Payload: the portable zip is *appended* to the launcher exe, so the
        # deliverable stays one file and the zip remains a complete archive. Because the
        # appended blob keeps its own central-directory offsets, ZipFile.OpenRead on the
        # exe reports 0 entries -- hence the EOCD math below, mirrored inside the
        # launcher (see tool/win_single/launcher.cs).
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content dist/version.txt -Raw).Trim()
          $zip = "dist/songbox-$ver-windows-x64-portable.zip"
          if (-not (Test-Path $zip)) { throw "portable zip missing: $zip" }

          $master = 'android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'
          if (-not (Test-Path $master)) { throw "icon master missing: $master" }
          # One script for both icons: this is the same tool/windows/make_icon.ps1 that
          # replaced windows/runner/resources/app_icon.ico before the build, so the
          # launcher exe and the app window carry the identical frames. Regenerating here
          # instead of reusing the earlier file keeps this step dependency-free; the bytes
          # come out the same from the same master PNG.
          $ico = Join-Path $env:RUNNER_TEMP 'songbox.ico'
          & 'tool/windows/make_icon.ps1' -Master $master -Ico $ico
          if (-not (Test-Path $ico)) { throw "no icon after make_icon.ps1: $ico" }

          # Same rule as the window title in main.cpp: the launcher source stays ASCII and
          # spells its Chinese with \u escapes, because csc also decodes BOM-less files
          # with the machine ANSI code page.
          $cs = Join-Path $env:RUNNER_TEMP 'launcher.cs'
          $t = Get-Content -Raw -Path 'tool/win_single/launcher.cs'
          # match the Version line itself, not a literal old default: when launcher.cs
          # already carries the version being built, a literal Replace is a silent no-op
          # and the next release would ship the previous stamp
          $t2 = [regex]::Replace($t, 'const string Version = "[0-9.]+";', 'const string Version = "' + $ver + '";')
          # assert on the result, not on "did the text change"
          if (-not $t2.Contains('const string Version = "' + $ver + '";')) {
            throw "launcher.cs patched for nothing: no Version line for $ver"
          }
          Set-Content -Path $cs -Value $t2 -Encoding ascii -NoNewline

          $csc = Join-Path $env:windir 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe missing: $csc" }
          $launcher = Join-Path $env:RUNNER_TEMP 'launcher.exe'
          # args as an array + splat: a backtick continuation inside YAML dies on one
          # stray trailing space, and the error looks like a compiler problem
          $cscArgs = @(
            '-nologo',
            '-target:winexe',
            "-win32icon:$ico",
            "-out:$launcher",
            '-r:System.IO.Compression.dll',
            '-r:System.IO.Compression.FileSystem.dll',
            '-r:System.Drawing.dll',
            $cs
          )
          & $csc @cscArgs
          if (-not (Test-Path $launcher)) { throw 'csc produced no launcher' }
          "launcher: $((Get-Item $launcher).Length) bytes"

          $single = "dist/songbox-$ver-windows-x64-single.exe"
          if (Test-Path $single) { Remove-Item $single -Force }
          $out = [System.IO.File]::Open($single, 'Create', 'ReadWrite')
          $fin = [System.IO.File]::OpenRead($launcher); $fin.CopyTo($out); $fin.Close()
          $launcherLen = $out.Position
          $zin = [System.IO.File]::OpenRead($zip); $zin.CopyTo($out); $zin.Close()
          $out.Close()

          # Verify the tail with the launcher's own algorithm: the blob start must equal
          # the launcher length exactly. Off by one byte and what she double-clicks is an
          # exe that unpacks nothing.
          $fs = [System.IO.File]::OpenRead($single)
          $size = $fs.Length
          $take = [Math]::Min(65536, $size)
          $buf = New-Object byte[] $take
          $fs.Seek($size - $take, [System.IO.SeekOrigin]::Begin) | Out-Null
          $fs.Read($buf, 0, $take) | Out-Null
          $eocd = -1
          for ($i = $take - 22; $i -ge 0; $i--) {
            if ($buf[$i] -eq 0x50 -and $buf[$i+1] -eq 0x4B -and $buf[$i+2] -eq 0x05 -and $buf[$i+3] -eq 0x06) { $eocd = $i; break }
          }
          $fs.Close()
          if ($eocd -lt 0) { throw 'no zip EOCD at the tail' }
          $cdSize = [BitConverter]::ToUInt32($buf, $eocd + 12)
          $cdOff = [BitConverter]::ToUInt32($buf, $eocd + 16)
          $blobStart = ($size - $take) + $eocd - $cdSize - $cdOff
          if ($blobStart -ne $launcherLen) {
            throw "tail mismatch: blob starts at $blobStart but launcher is $launcherLen bytes"
          }
          "single: $([math]::Round((Get-Item $single).Length/1MB,1))MB (launcher $launcherLen + zip $((Get-Item $zip).Length))"

      - name: 上传免安装产物
        uses: actions/upload-artifact@v4
        with:
          name: songbox-windows-x64-portable
          path: dist/songbox-*-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: 上传单文件产物
        uses: actions/upload-artifact@v4
        with:
          name: songbox-windows-x64-single
          path: dist/songbox-*-windows-x64-single.exe
          if-no-files-found: error
          retention-days: 14
